# Idle actions: dim, lock, DPMS, suspend. Locks before any sleep (lid, key, idle).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Dim after 60s
listener {
    timeout = 60
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
}

# Lock after 120s
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# Screen off after 300s
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend after 500s
# Change to: systemctl suspend-then-hibernate  (only after hibernate works)
listener {
    timeout = 500
    on-timeout = systemctl suspend
}
