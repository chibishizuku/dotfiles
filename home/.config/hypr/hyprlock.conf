# Standalone Hyprlock configuration. No HyDE dependency.
# Matches the live Anurati layout (wallbash colors baked in statically).

# This symlink is updated by ~/.config/hypr/wallpaper.sh so the lockscreen
# always shows the current wallpaper (not a random one from a folder).
$WALLPAPER = $HOME/.cache/wallpaper/current

# Colors captured from HyDE wallbash "Catppuccin Mocha" colors.conf
$pry1 = rgba(19,14,19,0.95)     # background
$txt1 = rgba(255,255,255,0.95)  # text
$1xa9 = rgba(255,204,255,0.95)  # day
$2xa9 = rgba(231,204,255,0.95)  # date
$3xa9 = rgba(228,204,255,0.95)  # input font
$pry2 = rgba(49,32,64,0.95)     # input inner
$pry4 = rgba(180,160,196,0.95)  # input outer / check
$4xa9 = rgba(232,204,255,0.95)  # user / battery

auth {
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    color = $pry1
    path = $WALLPAPER
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# DAY
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A" | sed 's/./& /g' | tr '[:lower:]' '[:upper:]')"
    color = $1xa9
    font_size = 110
    font_family = Anurati
    position = 0, 100
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d")"
    color = $2xa9
    font_size = 35
    font_family = Inter Display Medium
    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = $txt1
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $pry4
    inner_color = $pry2
    font_color = $3xa9
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = $pry4
    fail_color = rgba(FF0000FF)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, 80
    halign = center
    valign = bottom
}

# User name (no icon)
label {
    monitor =
    text = $USER
    color = $4xa9
    font_size = 20
    font_family = Inter Display Medium
    position = 0, 30
    halign = center
    valign = bottom
}

# Battery status if present
label {
    monitor =
    text = cmd[update:5000] sh -c 'p=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null) && [ -n "$p" ] && echo "$p%"'
    color = $4xa9
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -1%, 1%
    halign = right
    valign = bottom
}
