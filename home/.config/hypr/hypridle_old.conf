# Standalone Hypridle configuration. No HyDE dependency.
# Idle actions: dim, lock, DPMS, suspend.

general {
    lock_cmd = hyprlock
    unlock_cmd =
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Dim display after 60s idle
listener {
    timeout = 60
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
}

# Lock after 120s idle
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# DPMS off after 300s idle
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 500s idle
listener {
    timeout = 500
    on-timeout = systemctl suspend
}
